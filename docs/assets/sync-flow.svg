<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" role="img" aria-labelledby="flow-t flow-d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="flow-t">Contact SyncMate sync pipeline</title>
  <desc id="flow-d">A sync is triggered manually or by the auto-sync timer, both routed through the single SyncCoordinator. Preflight checks authorisation, contacts are fetched from both sides, a pre-sync snapshot is taken, differences are computed, duplicates detected, the user reviews and confirms, changes are applied one at a time with per-change logging, a post-sync snapshot is taken, and the result is written to history and surfaced as a notification. A dashed path shows rollback from a snapshot.</desc>

  <rect x="0" y="0" width="900" height="720" rx="12" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="719" rx="12" fill="none" stroke="#d0d7de"/>

  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#8b949e"/>
    </marker>
    <marker id="p" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#5B51E8"/>
    </marker>
    <marker id="gr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#34a853"/>
    </marker>
  </defs>

  <!-- Triggers -->
  <rect x="96" y="24" width="184" height="48" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
  <text x="188" y="46" text-anchor="middle" font-size="13" font-weight="650" fill="#1d1d1f">Sync Now (user)</text>
  <text x="188" y="62" text-anchor="middle" font-size="10.5" fill="#57606a">menu bar · dashboard · Shortcuts</text>

  <rect x="620" y="24" width="184" height="48" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
  <text x="712" y="46" text-anchor="middle" font-size="13" font-weight="650" fill="#1d1d1f">Auto-sync timer</text>
  <text x="712" y="62" text-anchor="middle" font-size="10.5" fill="#57606a">interval + power / net / idle rules</text>

  <!-- Coordinator -->
  <rect x="310" y="104" width="280" height="48" rx="9" fill="#eef1fb" stroke="#5B51E8" stroke-width="2"/>
  <text x="450" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#1d1d1f">SyncCoordinator.runSync()</text>
  <text x="450" y="142" text-anchor="middle" font-size="10.5" fill="#57606a">the only execution path — no duplicate logic</text>

  <path d="M188 74 V92 Q188 104 208 104 H308" stroke="#5B51E8" stroke-width="2.2" fill="none" marker-end="url(#p)"/>
  <path d="M712 74 V92 Q712 104 692 104 H592" stroke="#5B51E8" stroke-width="2.2" fill="none" marker-end="url(#p)"/>

  <!-- Steps -->
  <rect x="310" y="180" width="280" height="48" rx="9" fill="#fff6e5" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="450" y="202" text-anchor="middle" font-size="13" font-weight="650" fill="#1d1d1f">Preflight checks</text>
  <text x="450" y="218" text-anchor="middle" font-size="10.5" fill="#57606a">signed in? authorised? abort with a reason</text>
  <path d="M450 154 V178" stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#g)"/>

  <rect x="310" y="256" width="280" height="48" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
  <text x="450" y="278" text-anchor="middle" font-size="13" font-weight="650" fill="#1d1d1f">Fetch both sides</text>
  <text x="450" y="294" text-anchor="middle" font-size="10.5" fill="#57606a">People API + CNContactStore → UnifiedContact</text>
  <path d="M450 230 V254" stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#g)"/>

  <rect x="310" y="332" width="280" height="48" rx="9" fill="#eaf7ee" stroke="#34a853" stroke-width="1.8"/>
  <text x="450" y="354" text-anchor="middle" font-size="13" font-weight="650" fill="#1d1d1f">Pre-sync snapshot</text>
  <text x="450" y="370" text-anchor="middle" font-size="10.5" fill="#57606a">atomic JSON write · tagged with syncSessionId</text>
  <path d="M450 306 V330" stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#g)"/>

  <rect x="310" y="408" width="280" height="48" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
  <text x="450" y="430" text-anchor="middle" font-size="13" font-weight="650" fill="#1d1d1f">Compute diff</text>
  <text x="450" y="446" text-anchor="middle" font-size="10.5" fill="#57606a">ID mapping + fuzzy match → add/update/delete/merge</text>
  <path d="M450 382 V406" stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#g)"/>

  <rect x="310" y="484" width="280" height="48" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
  <text x="450" y="506" text-anchor="middle" font-size="13" font-weight="650" fill="#1d1d1f">Duplicate detection</text>
  <text x="450" y="522" text-anchor="middle" font-size="10.5" fill="#57606a">on-device NLP · optional AI for borderline pairs</text>
  <path d="M450 458 V482" stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#g)"/>

  <rect x="310" y="560" width="280" height="48" rx="9" fill="#fff6e5" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="450" y="582" text-anchor="middle" font-size="13" font-weight="650" fill="#1d1d1f">Review &amp; confirm</text>
  <text x="450" y="598" text-anchor="middle" font-size="10.5" fill="#57606a">preview all · per-contact override · dry-run</text>
  <path d="M450 534 V558" stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#g)"/>

  <rect x="310" y="636" width="280" height="48" rx="9" fill="#eef1fb" stroke="#5B51E8" stroke-width="2"/>
  <text x="450" y="658" text-anchor="middle" font-size="13" font-weight="700" fill="#1d1d1f">Apply changes</text>
  <text x="450" y="674" text-anchor="middle" font-size="10.5" fill="#57606a">one at a time · each logged with fields + session</text>
  <path d="M450 610 V634" stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#g)"/>

  <!-- Right column -->
  <rect x="638" y="408" width="222" height="48" rx="9" fill="#eaf7ee" stroke="#34a853" stroke-width="1.8"/>
  <text x="749" y="430" text-anchor="middle" font-size="13" font-weight="650" fill="#1d1d1f">Post-sync snapshot</text>
  <text x="749" y="446" text-anchor="middle" font-size="10.5" fill="#57606a">final state, same session ID</text>

  <rect x="638" y="484" width="222" height="48" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
  <text x="749" y="506" text-anchor="middle" font-size="13" font-weight="650" fill="#1d1d1f">History + notification</text>
  <text x="749" y="522" text-anchor="middle" font-size="10.5" fill="#57606a">audit log · macOS alert · Spotlight</text>

  <path d="M592 660 H749 V458" stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <path d="M749 458 V482" stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#g)"/>

  <!-- Rollback -->
  <rect x="40" y="408" width="222" height="48" rx="9" fill="#eaf7ee" stroke="#34a853" stroke-width="1.8"/>
  <text x="151" y="430" text-anchor="middle" font-size="13" font-weight="650" fill="#1d1d1f">Rollback available</text>
  <text x="151" y="446" text-anchor="middle" font-size="10.5" fill="#57606a">whole session or a single contact</text>
  <path d="M308 356 H151 V406" stroke="#34a853" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#gr)"/>
  <text x="151" y="478" text-anchor="middle" font-size="11" font-weight="600" fill="#1a7f3c">every sync is undoable</text>
</svg>
