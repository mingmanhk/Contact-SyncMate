<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 690" width="880" height="690" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">Contact SyncMate sync pipeline</title>
  <desc id="flow-desc">A sync is triggered manually or by the auto-sync timer, both routed through the single SyncCoordinator. Preflight checks authorisation. Contacts are fetched from both sides, a pre-sync snapshot is taken, differences are computed, duplicates are detected, the user reviews and confirms, changes are applied one at a time with per-change logging, a post-sync snapshot is taken, and the result is written to history and surfaced as a notification. Any sync can be rolled back from a snapshot.</desc>

  <style>
    .t    { font: 600 13px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1d1d1f; }
    .s    { font: 400 11px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #6e6e73; }
    .step { fill: #ffffff; stroke: #d2d2d7; stroke-width: 1.5; }
    .key  { fill: #eef1fb; stroke: #5B51E8; stroke-width: 2; }
    .safe { fill: #eaf7ee; stroke: #34a853; stroke-width: 1.8; }
    .gate { fill: #fff6e5; stroke: #f59e0b; stroke-width: 1.8; }
    .arw  { stroke: #86868b; stroke-width: 2; fill: none; }
    .arwk { stroke: #5B51E8; stroke-width: 2.4; fill: none; }
    .back { stroke: #34a853; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
    .cap  { font: 600 11px -apple-system, sans-serif; fill: #34a853; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #f5f5f7; } .s { fill: #a1a1a6; }
      .step { fill: #1f1f21; stroke: #3a3a3c; }
      .key  { fill: #23233a; stroke: #8b83ff; }
      .safe { fill: #16301f; stroke: #4ade80; }
      .gate { fill: #33270d; stroke: #fbbf24; }
      .arw  { stroke: #8e8e93; } .arwk { stroke: #8b83ff; }
      .back { stroke: #4ade80; } .cap { fill: #4ade80; }
    }
  </style>

  <defs>
    <marker id="h" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#86868b"/>
    </marker>
    <marker id="hk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#5B51E8"/>
    </marker>
    <marker id="hg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#34a853"/>
    </marker>
  </defs>

  <!-- Triggers -->
  <rect class="step" x="86" y="18" width="180" height="46" rx="9"/>
  <text class="t" x="176" y="40" text-anchor="middle">Sync Now (user)</text>
  <text class="s" x="176" y="55" text-anchor="middle">menu bar · dashboard · Shortcuts</text>

  <rect class="step" x="614" y="18" width="180" height="46" rx="9"/>
  <text class="t" x="704" y="40" text-anchor="middle">Auto-sync timer</text>
  <text class="s" x="704" y="55" text-anchor="middle">interval + power/network/idle rules</text>

  <!-- Coordinator -->
  <rect class="key" x="300" y="96" width="280" height="46" rx="9"/>
  <text class="t" x="440" y="118" text-anchor="middle">SyncCoordinator.runSync()</text>
  <text class="s" x="440" y="133" text-anchor="middle">the only execution path — no duplicate logic</text>

  <path class="arwk" d="M176 66 V84 Q176 96 196 96 H298" marker-end="url(#hk)"/>
  <path class="arwk" d="M704 66 V84 Q704 96 684 96 H582" marker-end="url(#hk)"/>

  <!-- Preflight -->
  <rect class="gate" x="300" y="168" width="280" height="46" rx="9"/>
  <text class="t" x="440" y="190" text-anchor="middle">Preflight checks</text>
  <text class="s" x="440" y="205" text-anchor="middle">Google signed in? Contacts authorised? abort with reason</text>
  <path class="arw" d="M440 144 V166" marker-end="url(#h)"/>

  <!-- Fetch -->
  <rect class="step" x="300" y="240" width="280" height="46" rx="9"/>
  <text class="t" x="440" y="262" text-anchor="middle">Fetch both sides</text>
  <text class="s" x="440" y="277" text-anchor="middle">Google People API + CNContactStore → UnifiedContact</text>
  <path class="arw" d="M440 216 V238" marker-end="url(#h)"/>

  <!-- Pre-sync backup -->
  <rect class="safe" x="300" y="312" width="280" height="46" rx="9"/>
  <text class="t" x="440" y="334" text-anchor="middle">Pre-sync snapshot</text>
  <text class="s" x="440" y="349" text-anchor="middle">atomic write · linked by syncSessionId</text>
  <path class="arw" d="M440 288 V310" marker-end="url(#h)"/>

  <!-- Diff -->
  <rect class="step" x="300" y="384" width="280" height="46" rx="9"/>
  <text class="t" x="440" y="406" text-anchor="middle">Compute diff</text>
  <text class="s" x="440" y="421" text-anchor="middle">ID mapping + fuzzy match → add / update / delete / merge</text>
  <path class="arw" d="M440 360 V382" marker-end="url(#h)"/>

  <!-- Dedup -->
  <rect class="step" x="300" y="456" width="280" height="46" rx="9"/>
  <text class="t" x="440" y="478" text-anchor="middle">Duplicate detection</text>
  <text class="s" x="440" y="493" text-anchor="middle">on-device NLP · optional AI tier for borderline pairs</text>
  <path class="arw" d="M440 432 V454" marker-end="url(#h)"/>

  <!-- Review gate -->
  <rect class="gate" x="300" y="528" width="280" height="46" rx="9"/>
  <text class="t" x="440" y="550" text-anchor="middle">Review &amp; confirm</text>
  <text class="s" x="440" y="565" text-anchor="middle">preview every change · per-contact override · dry-run</text>
  <path class="arw" d="M440 504 V526" marker-end="url(#h)"/>

  <!-- Apply -->
  <rect class="key" x="300" y="600" width="280" height="46" rx="9"/>
  <text class="t" x="440" y="622" text-anchor="middle">Apply changes</text>
  <text class="s" x="440" y="637" text-anchor="middle">one at a time · each logged with fields + session ID</text>
  <path class="arw" d="M440 576 V598" marker-end="url(#h)"/>

  <!-- Right column: post-sync + outputs -->
  <rect class="safe" x="622" y="384" width="216" height="46" rx="9"/>
  <text class="t" x="730" y="406" text-anchor="middle">Post-sync snapshot</text>
  <text class="s" x="730" y="421" text-anchor="middle">final state, same session ID</text>

  <rect class="step" x="622" y="456" width="216" height="46" rx="9"/>
  <text class="t" x="730" y="478" text-anchor="middle">History + notification</text>
  <text class="s" x="730" y="493" text-anchor="middle">per-change log · macOS alert · Spotlight</text>

  <path class="arw" d="M582 623 H730 V432" marker-end="url(#h)"/>
  <path class="arw" d="M730 432 V454" marker-end="url(#h)"/>

  <!-- Rollback path -->
  <rect class="safe" x="42" y="384" width="216" height="46" rx="9"/>
  <text class="t" x="150" y="406" text-anchor="middle">Rollback available</text>
  <text class="s" x="150" y="421" text-anchor="middle">whole session or single contact</text>
  <path class="back" d="M298 335 H150 V382" marker-end="url(#hg)"/>
  <text class="cap" x="150" y="452" text-anchor="middle">every sync is undoable</text>
</svg>
