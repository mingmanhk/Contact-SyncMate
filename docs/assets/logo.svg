<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="csm-logo-title">
  <title id="csm-logo-title">Contact SyncMate</title>

  <!--
    Geometry mirrors Scripts/generate-app-icon.swift exactly, so the website
    logo and the shipped macOS app icon are the same artwork:
      body     824 × 824 squircle at (100, 90), corner radius 185.4
      ring     r 244, stroke 66, centred at (512, 502)
      arcs     24°–158° and 204°–338°, both swept counter-clockwise
      arrows   continue counter-clockwise (tangent = angle + 90°)
      person   head r 62 at (512, 444); shoulders = top half of a 196 × 180
               ellipse whose flat edge sits at y 602
  -->

  <defs>
    <linearGradient id="csmBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#695FF2"/>
      <stop offset="1"   stop-color="#3E2FC4"/>
    </linearGradient>
    <linearGradient id="csmSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="csmShadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity=".22"/>
    </filter>
    <clipPath id="csmBodyClip">
      <rect x="100" y="90" width="824" height="824" rx="185.4" ry="185.4"/>
    </clipPath>
  </defs>

  <!-- Icon body -->
  <g filter="url(#csmShadow)">
    <rect x="100" y="90" width="824" height="824" rx="185.4" ry="185.4" fill="url(#csmBody)"/>
  </g>
  <rect x="100" y="90" width="824" height="824" rx="185.4" ry="185.4"
        fill="url(#csmSheen)" clip-path="url(#csmBodyClip)"/>

  <!-- Sync ring: two counter-clockwise sweeps -->
  <g fill="none" stroke="#ffffff" stroke-width="66">
    <path d="M734.9 402.8 A244 244 0 0 0 285.8 410.6"/>
    <path d="M289.1 601.2 A244 244 0 0 0 738.2 593.4"/>
  </g>

  <!-- Arrowheads, continuing the same rotation -->
  <g fill="#ffffff">
    <path d="M255.1 486.6 L224.6 385.9 L347.0 435.3 Z"/>
    <path d="M768.9 517.4 L799.4 618.1 L677.0 568.7 Z"/>
  </g>

  <!-- Person: head + shoulders -->
  <g fill="#ffffff">
    <circle cx="512" cy="444" r="62"/>
    <path d="M414 602 A98 90 0 0 1 610 602 Z"/>
  </g>
</svg>
