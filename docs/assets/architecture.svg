<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Contact SyncMate architecture</title>
  <desc id="arch-desc">Google Contacts and Apple Contacts both connect directly to Contact SyncMate running on the user's Mac. Inside the app, a Sync Coordinator drives a Sync Engine which uses a Google connector, a Mac connector, a deduplication engine, a backup store and a history log. No developer-operated server exists anywhere in the diagram.</desc>

  <style>
    .lbl   { font: 600 14px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1d1d1f; }
    .sub   { font: 400 11.5px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #6e6e73; }
    .hdr   { font: 700 15px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1d1d1f; }
    .mono  { font: 400 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #6e6e73; }
    .box   { fill: #f5f5f7; stroke: #d2d2d7; stroke-width: 1.5; }
    .cloud { fill: #eef1fb; stroke: #b9c2ee; stroke-width: 1.5; }
    .mac   { fill: #ffffff; stroke: #5B51E8; stroke-width: 2.5; }
    .inner { fill: #ffffff; stroke: #d2d2d7; stroke-width: 1.2; }
    .flow  { stroke: #5B51E8; stroke-width: 2.5; fill: none; }
    .note  { font: italic 400 12px -apple-system, sans-serif; fill: #147a3d; }
    @media (prefers-color-scheme: dark) {
      .lbl, .hdr { fill: #f5f5f7; }
      .sub, .mono { fill: #a1a1a6; }
      .box   { fill: #26262a; stroke: #3a3a3c; }
      .cloud { fill: #23233a; stroke: #4b4b7a; }
      .mac   { fill: #1c1c1e; stroke: #8b83ff; }
      .inner { fill: #1f1f21; stroke: #3a3a3c; }
      .flow  { stroke: #8b83ff; }
      .note  { fill: #4ade80; }
    }
  </style>

  <defs>
    <marker id="a-end" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#5B51E8"/>
    </marker>
    <marker id="a-start" markerWidth="9" markerHeight="9" refX="2" refY="4.5" orient="auto">
      <path d="M9 0 L0 4.5 L9 9 z" fill="#5B51E8"/>
    </marker>
  </defs>

  <!-- ── Left: Google ── -->
  <rect class="cloud" x="18" y="150" width="168" height="112" rx="14"/>
  <text class="hdr" x="102" y="182" text-anchor="middle">Google Contacts</text>
  <text class="sub" x="102" y="203" text-anchor="middle">People API</text>
  <text class="mono" x="102" y="223" text-anchor="middle">people.googleapis.com</text>
  <text class="sub" x="102" y="243" text-anchor="middle">OAuth 2.0 + PKCE</text>

  <!-- ── Right: Apple ── -->
  <rect class="cloud" x="694" y="150" width="168" height="112" rx="14"/>
  <text class="hdr" x="778" y="182" text-anchor="middle">Apple Contacts</text>
  <text class="sub" x="778" y="203" text-anchor="middle">Contacts.framework</text>
  <text class="mono" x="778" y="223" text-anchor="middle">CNContactStore</text>
  <text class="sub" x="778" y="243" text-anchor="middle">iCloud / On My Mac</text>

  <!-- ── Centre: the Mac ── -->
  <rect class="mac" x="226" y="58" width="428" height="330" rx="18"/>
  <text class="hdr" x="440" y="88" text-anchor="middle">Your Mac — Contact SyncMate</text>
  <text class="sub" x="440" y="107" text-anchor="middle">native macOS menu bar app · all processing local</text>

  <!-- Coordinator -->
  <rect class="inner" x="252" y="124" width="376" height="44" rx="10"/>
  <text class="lbl" x="440" y="145" text-anchor="middle">SyncCoordinator</text>
  <text class="sub" x="440" y="160" text-anchor="middle">single entry point · phase &amp; progress state</text>

  <!-- Engine -->
  <rect class="inner" x="252" y="180" width="376" height="44" rx="10"/>
  <text class="lbl" x="440" y="201" text-anchor="middle">SyncEngine</text>
  <text class="sub" x="440" y="216" text-anchor="middle">fetch → diff → dedup → apply</text>

  <!-- Service row -->
  <rect class="box" x="252" y="238" width="118" height="62" rx="9"/>
  <text class="lbl" x="311" y="262" text-anchor="middle">Connectors</text>
  <text class="sub" x="311" y="278" text-anchor="middle">Google · Mac</text>
  <text class="sub" x="311" y="292" text-anchor="middle">ID mapping store</text>

  <rect class="box" x="381" y="238" width="118" height="62" rx="9"/>
  <text class="lbl" x="440" y="262" text-anchor="middle">Deduplicator</text>
  <text class="sub" x="440" y="278" text-anchor="middle">on-device NLP</text>
  <text class="sub" x="440" y="292" text-anchor="middle">+ optional AI tier</text>

  <rect class="box" x="510" y="238" width="118" height="62" rx="9"/>
  <text class="lbl" x="569" y="262" text-anchor="middle">Backup + History</text>
  <text class="sub" x="569" y="278" text-anchor="middle">pre/post snapshots</text>
  <text class="sub" x="569" y="292" text-anchor="middle">per-change audit log</text>

  <!-- Storage row -->
  <rect class="box" x="252" y="314" width="182" height="52" rx="9"/>
  <text class="lbl" x="343" y="336" text-anchor="middle">macOS Keychain</text>
  <text class="sub" x="343" y="353" text-anchor="middle">OAuth tokens · API keys</text>

  <rect class="box" x="446" y="314" width="182" height="52" rx="9"/>
  <text class="lbl" x="537" y="336" text-anchor="middle">Local disk</text>
  <text class="sub" x="537" y="353" text-anchor="middle">snapshots · history · settings</text>

  <!-- Bidirectional flows -->
  <path class="flow" d="M188 206 H224" marker-start="url(#a-start)" marker-end="url(#a-end)"/>
  <path class="flow" d="M656 206 H692" marker-start="url(#a-start)" marker-end="url(#a-end)"/>

  <text class="note" x="440" y="424" text-anchor="middle">No developer-operated server exists in this diagram — there is no backend to send data to.</text>
  <text class="sub"  x="440" y="446" text-anchor="middle">Contact data flows only between your Mac and the two providers you already use.</text>
</svg>
