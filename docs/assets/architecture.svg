<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="arch-t arch-d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="arch-t">Contact SyncMate architecture</title>
  <desc id="arch-d">Google Contacts and Apple Contacts connect directly to Contact SyncMate running on the user's Mac. Inside the app, SyncCoordinator drives SyncEngine, which uses connectors, a deduplicator, and backup and history stores. Secrets live in the macOS Keychain and data on local disk. No developer-operated server appears anywhere in the diagram.</desc>

  <!-- Panel background: keeps the diagram legible on both light and dark
       README themes. GitHub strips <style> from SVG, so every colour here is
       an inline presentation attribute. -->
  <rect x="0" y="0" width="900" height="500" rx="12" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="499" rx="12" fill="none" stroke="#d0d7de"/>

  <defs>
    <marker id="ae" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#5B51E8"/>
    </marker>
    <marker id="as" markerWidth="9" markerHeight="9" refX="1.5" refY="4.5" orient="auto">
      <path d="M9 0 L0 4.5 L9 9 z" fill="#5B51E8"/>
    </marker>
  </defs>

  <!-- ── Google ── -->
  <rect x="20" y="168" width="176" height="120" rx="14" fill="#eef1fb" stroke="#b9c2ee" stroke-width="1.5"/>
  <text x="108" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#1d1d1f">Google Contacts</text>
  <text x="108" y="222" text-anchor="middle" font-size="12" fill="#57606a">People API</text>
  <text x="108" y="243" text-anchor="middle" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#57606a">people.googleapis.com</text>
  <text x="108" y="266" text-anchor="middle" font-size="12" fill="#57606a">OAuth 2.0 + PKCE</text>

  <!-- ── Apple ── -->
  <rect x="704" y="168" width="176" height="120" rx="14" fill="#eef1fb" stroke="#b9c2ee" stroke-width="1.5"/>
  <text x="792" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#1d1d1f">Apple Contacts</text>
  <text x="792" y="222" text-anchor="middle" font-size="12" fill="#57606a">Contacts.framework</text>
  <text x="792" y="243" text-anchor="middle" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#57606a">CNContactStore</text>
  <text x="792" y="266" text-anchor="middle" font-size="12" fill="#57606a">iCloud / On My Mac</text>

  <!-- ── The Mac ── -->
  <rect x="232" y="52" width="436" height="366" rx="18" fill="#fbfbfd" stroke="#5B51E8" stroke-width="2.5"/>
  <text x="450" y="84" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1d1d1f">Your Mac — Contact SyncMate</text>
  <text x="450" y="104" text-anchor="middle" font-size="11.5" fill="#57606a">native macOS menu bar app · all processing local</text>

  <rect x="258" y="122" width="384" height="46" rx="10" fill="#eef1fb" stroke="#5B51E8" stroke-width="1.6"/>
  <text x="450" y="143" text-anchor="middle" font-size="13.5" font-weight="650" fill="#1d1d1f">SyncCoordinator</text>
  <text x="450" y="159" text-anchor="middle" font-size="11" fill="#57606a">the only entry point · publishes phase &amp; progress</text>

  <rect x="258" y="180" width="384" height="46" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/>
  <text x="450" y="201" text-anchor="middle" font-size="13.5" font-weight="650" fill="#1d1d1f">SyncEngine</text>
  <text x="450" y="217" text-anchor="middle" font-size="11" fill="#57606a">fetch → diff → dedup → apply</text>

  <rect x="258" y="238" width="120" height="66" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.3"/>
  <text x="318" y="261" text-anchor="middle" font-size="12.5" font-weight="650" fill="#1d1d1f">Connectors</text>
  <text x="318" y="278" text-anchor="middle" font-size="10.5" fill="#57606a">Google · Mac</text>
  <text x="318" y="293" text-anchor="middle" font-size="10.5" fill="#57606a">ID mapping store</text>

  <rect x="390" y="238" width="120" height="66" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.3"/>
  <text x="450" y="261" text-anchor="middle" font-size="12.5" font-weight="650" fill="#1d1d1f">Deduplicator</text>
  <text x="450" y="278" text-anchor="middle" font-size="10.5" fill="#57606a">on-device NLP</text>
  <text x="450" y="293" text-anchor="middle" font-size="10.5" fill="#57606a">+ optional AI tier</text>

  <rect x="522" y="238" width="120" height="66" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.3"/>
  <text x="582" y="261" text-anchor="middle" font-size="12.5" font-weight="650" fill="#1d1d1f">Backup + History</text>
  <text x="582" y="278" text-anchor="middle" font-size="10.5" fill="#57606a">pre/post snapshots</text>
  <text x="582" y="293" text-anchor="middle" font-size="10.5" fill="#57606a">per-change audit</text>

  <rect x="258" y="318" width="186" height="54" rx="9" fill="#eaf7ee" stroke="#34a853" stroke-width="1.4"/>
  <text x="351" y="341" text-anchor="middle" font-size="12.5" font-weight="650" fill="#1d1d1f">macOS Keychain</text>
  <text x="351" y="358" text-anchor="middle" font-size="10.5" fill="#57606a">OAuth tokens · API keys</text>

  <rect x="456" y="318" width="186" height="54" rx="9" fill="#eaf7ee" stroke="#34a853" stroke-width="1.4"/>
  <text x="549" y="341" text-anchor="middle" font-size="12.5" font-weight="650" fill="#1d1d1f">Local disk</text>
  <text x="549" y="358" text-anchor="middle" font-size="10.5" fill="#57606a">snapshots · history · settings</text>

  <!-- Bidirectional links -->
  <path d="M198 224 H230" stroke="#5B51E8" stroke-width="2.5" fill="none" marker-start="url(#as)" marker-end="url(#ae)"/>
  <path d="M670 224 H702" stroke="#5B51E8" stroke-width="2.5" fill="none" marker-start="url(#as)" marker-end="url(#ae)"/>

  <text x="450" y="452" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a7f3c">No developer-operated server exists in this diagram — there is no backend to send data to.</text>
  <text x="450" y="474" text-anchor="middle" font-size="11.5" fill="#57606a">Contact data flows only between your Mac and the two providers you already use.</text>
</svg>
